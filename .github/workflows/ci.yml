name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  required:
    name: CI required
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality gate
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
