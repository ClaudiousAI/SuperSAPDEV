name: Prepare draft delivery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draft-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  draft:
    name: Prepare unpublished development candidate
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate
          path: candidate
      - name: Verify delivered bytes
        working-directory: candidate
        run: sha256sum --check --strict SHA256SUMS
      - name: Create draft for human review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="candidate-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp candidate/REVIEW.md notes.md
          printf '\nSource commit: `%s`\nEvidence: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> notes.md
          gh release create "$tag" candidate/* \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "Development candidate $tag" --notes-file notes.md
