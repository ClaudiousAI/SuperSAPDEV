name: Reusable workspace checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  workspace:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned workspace manager
        run: python -m pip install uv==0.10.12
      - name: Clean locked installation
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Strict types
        run: uv run --locked mypy
      - name: STATIC and MOCK tests
        run: uv run --locked pytest --junitxml=.local/reports/pytest.xml
      - name: Offline smoke
        run: uv run --locked supersap smoke --json
      - name: Reproducible distributions and clean wheel install
        run: uv run --locked python scripts/check_distribution.py --output-dir .local/candidate
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: .local/reports/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified delivery candidate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-candidate
          path: .local/candidate/*
          if-no-files-found: error
          retention-days: 14
