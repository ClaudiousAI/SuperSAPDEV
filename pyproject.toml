[build-system]
requires = ["uv_build==0.10.12"]
build-backend = "uv_build"

[project]
name = "super-sap-dev"
version = "0.1.0.dev1"
description = "SAP knowledge harvesting and portable skill tooling"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["jsonschema>=4.26,<5"]

[project.scripts]
supersap = "supersap.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
    "types-jsonschema>=4.26,<5",
]

[tool.uv]
required-version = "==0.10.12"
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "supersap"
source-include = ["schemas/**", "tests/**", "scripts/**", "uv.lock"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".local", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = ["error"]
